schema: provider-profile/v1
provider: azure-ai-foundry

# Public template for five exact East US 2 deployments that passed sanitized nonstreaming and
# streaming transport canaries on 2026-08-29. Replace only the resource-name placeholder and
# provide the key through AZURE_INFERENCE_CREDENTIAL. No credential or resource name is stored.
#
# GPT-5.6 is intentionally bounded to the <=272k short-context pricing tier because the current
# portable RouteConfig has one price pair. The models' full documented 1.05M window and the exact
# tiering limitation are retained in docs/provider-contracts/azure-ai-foundry-eastus2-2026-08-29.yaml.
route_defaults:
  auth:
    env: AZURE_INFERENCE_CREDENTIAL
    header: api-key
    prefix: ""
  region: eastus2
  billing_channel: azure_subscription_metered
  quota_scope: azure-subscription-model-version-globalstandard-shared-across-regions
  stream_usage_mode: try
  request_timeout_seconds: 900
  http2: false
  connection_reuse: true
  transport_max_connections: 128
  input_token_reservation_overhead: 1024
  evidence_retrieved_at_utc: "2026-08-29T23:00:00Z"
  evidence_bundle_sha256: 7ca7a36fd3a18a1dc610633441b1b8882abcf80efe18fa656db3336f3bc6e6bc
  capabilities:
    documentation_checked_utc: "2026-08-29T23:00:00Z"
    streaming: true
    caching: unknown
    batch_chat: unknown
    embeddings: false
    rerank: false

