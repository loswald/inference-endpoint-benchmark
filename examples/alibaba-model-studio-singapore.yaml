campaign:
  name: alibaba-model-studio-singapore-example
  seed: 20260829
  max_wall_seconds: 21600
  max_cost_usd: 100
  launch_reserve_seconds: 300
  launch_reserve_usd: 5
  concurrency: 32
  retries: 2
  input_token_reservation_factor: 1.5
  client_location: replace-with-exact-client-region

# Replace only the workspace ID and client location. The API key belongs in DASHSCOPE_API_KEY;
# never put it in this file. Alibaba keys, catalogs, prices, and endpoints are region-bound.
route_defaults: &alibaba_singapore
  provider: alibaba-model-studio
  adapter: alibaba_model_studio
  auth:
    env: DASHSCOPE_API_KEY
    header: Authorization
    prefix: "Bearer "
  region: ap-southeast-1
  billing_channel: pay_as_you_go
  api_family: chat_completions
  api_version: compatible-mode-v1
  quota_scope: root-account-plus-model-across-workspaces-users-and-keys
  context_tokens: 1000000
  # The authenticated catalog did not publish this field. The output suite therefore runs finite
  # screening anchors only; it cannot establish or claim the provider's exact maximum.
  max_output_tokens: null
  output_limit_field: max_completion_tokens
  stream_usage_mode: required
  request_timeout_seconds: 3600
  http2: false
  connection_reuse: true
  transport_max_connections: 128
  input_token_reservation_overhead: 1024
  documentation_source_url: https://www.alibabacloud.com/help/en/model-studio/qwen-api-reference
  pricing_source_url: https://www.alibabacloud.com/help/en/model-studio/model-pricing
  evidence_retrieved_at_utc: "2026-08-29T00:00:00Z"
  evidence_bundle_sha256: f4935e66219f4ecfdf30a637e4a695dbf453298e55253799cda8c5af7c8647f5
  capabilities:
    documentation_checked_utc: "2026-08-29T00:00:00Z"
    streaming: true
    thinking: documented_supported_runner_not_implemented
    function_calling: true
    json_object: true
    json_schema: singapore_live_test_required
    vision: exact_api_family_live_test_required
    implicit_exact_prefix_cache: automatic_best_effort
    explicit_ephemeral_cache: documented_supported_runner_not_implemented
    batch_chat: documented_unsupported_for_exact_route
    batch_embeddings: documented_unsupported_for_exact_route
    embeddings: model_specific
    rerank: exact_path_and_region_live_test_required

routes:
  - id: alibaba-sg-qwen3.8-flash
    model: qwen3.8-flash
    model_version: floating-catalog-id-observed-2026-08-29
    base_url: https://replace-with-workspace-id.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1/chat/completions
    input_usd_per_million: 0.15
    output_usd_per_million: 0.47
    # The model-specific cache discount is deliberately omitted until its exact current price is
    # bound to the route. Cached-token counts are still measured.
    cached_input_usd_per_million: null

suites:
  static:
    offered_rps: 1
  warmup:
    enabled: true
    repeats: 2
    shapes: [short_short]
  latency:
    enabled: true
    repeats: 10
    shapes: [short_short, long_short, short_long, mixed]
  capability: {enabled: true}
  interactions:
    enabled: true
    # Alibaba documents temperature in [0, 2), so 2.0 is not a valid interaction setting.
    temperatures: [0.0, 0.7, 1.0]
  context:
    enabled: true
    percentages: [1, 10, 25, 50, 75, 90, 95, 99]
  output: {enabled: true}
  quality:
    enabled: true
    repeats: 3
  cache:
    enabled: true
    repeats: 5
    prefix_tokens: 4096
  aimd:
    enabled: true
    shapes: [short_short, long_short, short_long, mixed]
    long_input_tokens: 100000
    long_input_overflow: fail
    long_output_tokens: 4096
    long_output_overflow: fail
    initial_rps: 0.5
    additive_rps: 0.5
    multiplicative_decrease: 0.5
    bracket_epochs: 10
    bracket_multiplier: 2
    max_rps: 256
    epochs: 16
    epoch_seconds: 20
    baseline_rps: 0.5
    minimum_rps: 0.03125
    baseline_samples: 20
    baseline_attempts: 5
    confirmation_max_stages: 12
    concurrency: 128
    acceptance_policy:
      schema_version: capacity-acceptance/v1
      min_success_fraction: 0.99
      max_throttled_attempt_fraction: 0.01
      max_retryable_error_attempt_fraction: 0.01
      queue_delay_floor_seconds: 1
      max_p95_queue_delay_fraction_of_window: 0.10
      max_p95_latency_multiplier_from_baseline: 2
