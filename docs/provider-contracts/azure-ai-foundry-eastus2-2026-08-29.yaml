schema: provider-evidence-bundle/v1
provider: azure-ai-foundry
retrieved_at_utc: "2026-08-29T23:00:00Z"
source_role: provider_primary_documentation_plus_sanitized_live_transport_receipts
rights_posture: public_provider_documentation_for_internal_r_and_d

scope:
  region: eastus2
  deployment_sku: GlobalStandard
  billing_channel: azure_subscription_metered
  account_name_publication: redacted
  exact_text_routes: 5
  exact_embedding_routes: 1
  performance_claim_eligible: false
  claim_boundary: >-
    This bundle admits five exact text deployment/API transports and one text-embedding transport
    for future benchmarking. The one-request canaries prove reachability, parser compatibility,
    streaming where applicable, and usage accounting only. They do not prove quality, latency,
    capacity, reliability, or Pareto rank.

endpoint_contracts:
  responses:
    host_template: "{resource}.services.ai.azure.com"
    path: /openai/v1/responses
    api_version: openai-compatible-v1-implicit
    authentication: api-key
    deployment_selector: request.model
    documentation_status: current
  chat_completions:
    host_template: "{resource}.services.ai.azure.com"
    path: /models/chat/completions
    api_version: openai-compatible-v1
    authentication: api-key
    deployment_selector: request.model
    documentation_status: live_proved_legacy_model_inference_path
    migration_note: >-
      Microsoft now recommends the OpenAI v1-compatible endpoint for new integrations and
      documents retirement of the Azure AI Inference beta SDK. This profile preserves the
      exact /models/chat/completions path that was live-proved on 2026-08-29; moving either
      chat route to /openai/v1/chat/completions requires a new route-specific canary.

quota_contract:
  documented_global_standard_scope: >-
    Deployments of the same model and version share one quota pool across all regions in
    an Azure subscription.
  live_control_plane_allocations:
    gpt-5.6-sol:
      rpm: 7500
      tpm: 7500000
    gpt-5.6-terra:
      rpm: 7500
      tpm: 7500000
    gpt-5.6-luna:
      rpm: 5000
      tpm: 5000000
    DeepSeek-V4-Flash:
      rpm: 1000
      tpm: 1000000
    Kimi-K2.6:
      rpm: 100
      tpm: 100000
  interpretation: >-
    These are configured deployment limits observed through Azure Resource Manager, not
    measured sustainable throughput. Azure can enforce RPM over shorter intervals, and TPM
    admission uses an estimated maximum processed-token count rather than billable usage.

