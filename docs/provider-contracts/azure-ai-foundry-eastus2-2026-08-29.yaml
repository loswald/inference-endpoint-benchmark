explicit_gaps:
  - No quality, latency-distribution, capacity, reliability, cache-hit, or long-context benchmark was run during route admission.
  - GPT-5.6 prompts above 272,000 tokens require the separate long-context price tier, which the current RouteConfig cannot express.
  - GPT-5.6 cache-write pricing cannot be represented by the current single cached-input price field.
  - Kimi-K2.6 is a preview deployment and its vision and tool-calling capabilities are documented but not live-proved by this text-only admission.
  - DeepSeek-V4-Flash and Kimi-K2.6 were proved on the legacy /models/chat/completions path; the recommended OpenAI v1 chat path requires its own canary before substitution.
  - The embeddings transport, adapter, and 11-cell contract suite are available, but no terminal embedding benchmark is published yet.

