profile_execution_contract:
  gpt_5_6_context_tokens: 272000
  gpt_5_6_context_reason: >-
    The reusable RouteConfig has one input/output price pair and cannot represent Azure's
    short- versus long-context pricing tiers. The public executable profile therefore remains
    within the documented short-context tier. This is an execution envelope, not a claim that
    the models stop at 272k; their full documented window is 1.05M tokens.
  cache_write_cost_gap: >-
    RouteConfig has no separate cache-write price. The profile records ordinary and cached-read
    prices exactly, while this evidence bundle records cache-write prices. Cost results for GPT-5.6
    cache-population requests must be labeled estimated until tiered cache-write accounting exists.
  pricing_freshness: >-
    GPT-5.6 Sol has a scheduled promotion beginning 2026-09-01. Refresh the dated profile before
    any later spend-bearing run; do not silently apply the future rate to 2026-08-29 evidence.

