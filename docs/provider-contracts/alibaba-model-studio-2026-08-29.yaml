      context_window_tokens: 1000000
      maximum_output_tokens: not_published_in_authenticated_catalog
      input_usd_per_million: 2.00
      output_usd_per_million: 6.00
      singapore_default_rpm: 15000
      singapore_default_tpm: 2000000
