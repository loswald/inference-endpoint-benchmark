      catalog_present: true
      context_window_tokens: 1000000
      maximum_output_tokens: 131072
      input_usd_per_million: 0.50
      output_usd_per_million: 3.00
      implicit_cached_input_usd_per_million: 0.10
      singapore_default_rpm: 5000
      singapore_default_tpm: 5000000
    - model: deepseek-v4-flash
      catalog_present: true
      context_window_tokens: 1000000
      maximum_output_tokens: not_bound
      input_usd_per_million: 0.20
      output_usd_per_million: 0.40
      singapore_default_rpm: 10000
      singapore_default_tpm: 1200000
