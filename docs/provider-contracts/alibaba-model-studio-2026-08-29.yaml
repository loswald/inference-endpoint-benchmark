provider_contracts:
  stream_usage:
    include_usage_request_field: stream_options.include_usage
    terminal_usage_chunk: true
  output_limit:
    request_field: max_completion_tokens
    reported_output_count_tolerance_tokens: 10
    contract: >-
      Alibaba documents that the actual output-token count can differ from the requested
      max_completion_tokens value by up to 10 tokens. Counts above request plus 10 remain an
      invalid usage-bound violation.
  caching:
    implicit: automatic_best_effort_exact_prefix
    implicit_minimum_prefix_tokens: 256
    explicit_minimum_prefix_tokens: 1024
    explicit_ttl_minutes: 5
    explicit_maximum_markers: 4
  batch:
    # Batch support is region- and model-specific. Do not infer Singapore support from the
    # broader China (Beijing) matrix.
    singapore:
      supported_endpoint: /v1/chat/completions
      supported_chat_models: [qwen-max, qwen-plus, qwen-flash, qwen-turbo]
      exact_qwen3_8_flash_state: documented_unsupported_for_exact_route
      embeddings_state: documented_unsupported_in_region
    china_beijing:
      supported_endpoints: [/v1/chat/completions, /v1/embeddings]
      text_embedding_models: [text-embedding-v4]
    maximum_rows: 50000
    maximum_file_bytes: 500000000
    cache_discount_eligible: false
  adaptive_load:
    dimensions: [rpm, tpm, rps, tps, burst_growth]
    congestion_http_status: 429
    typical_recovery_seconds: 60

