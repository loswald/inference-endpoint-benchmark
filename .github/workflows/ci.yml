name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip install pytest==9.1.1 ruff==0.15.22
      - run: ruff check .
      - run: pytest
      - run: inference-bench plan examples/provider-stubs.yaml > /tmp/plan.json
      - name: DigitalOcean template fails closed until priced and identified
        run: |
          if inference-bench plan examples/digitalocean.yaml > /tmp/do-plan.json 2> /tmp/do-plan.err; then
            echo "unpriced DigitalOcean template unexpectedly planned"
            exit 1
          fi
          grep -q "incomplete pricing" /tmp/do-plan.err
