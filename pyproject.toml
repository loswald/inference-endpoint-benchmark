[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "inference-endpoint-benchmark"
version = "0.1.0"
description = "Provider-neutral, reproducible technical benchmarking for hosted inference endpoints"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Sqwish Labs"}]
dependencies = [
  "httpx>=0.27,<1",
  "matplotlib>=3.9,<4",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
inference-bench = "inference_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inference_bench"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
